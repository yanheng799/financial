[project]
name = "financial"
version = "0.1.0"
description = "A 股金融数据研究工具，基于 Tushare 提供行情、财务、资金流、板块等数据获取与分析能力"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
    { name = "yanhe" },
]

dependencies = [
    "tushare>=1.4",
    "pandas>=2.0",
    "numpy>=1.24",
    "langchain-core>=1.4.0",
    "langgraph>=1.2.2",
    "pydantic>=2.0",
    "httpx>=0.27",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ── Ruff (linter + formatter) ──────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ── pytest ──────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
